<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>💬 Ask About My Thesis</h2>
            <p>Ask any question about my research and get AI-powered answers</p>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    👋 Hi! I'm here to answer questions about the thesis. What would you like to know?
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Ask a question about the thesis..."
                    maxlength="500"
                >
                <button id="sendButton">Send</button>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p>Thinking...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
